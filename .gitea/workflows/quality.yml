  product_quality:
    runs-on: ubuntu-latest
    needs: architecture_gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./orket_extension_sdk[testing]" -e ".[dev]"

      - name: Run product suite (explicit scope when present)
        run: |
          if [ -d "product/sneaky_price_watch/tests" ]; then
            PYTHONPATH=product/sneaky_price_watch pytest product/sneaky_price_watch/tests -q
          else
            echo "product/sneaky_price_watch/tests not present; suite intentionally excluded."
          fi

  sandbox_docker_acceptance:
    runs-on: ubuntu-latest
    # Keep the Docker lifecycle proof reachable even if unrelated repo-wide gates fail.
    needs: [rulesim_determinism_matrix, docs_hygiene]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./orket_extension_sdk[testing]" -e ".[dev]"

      - name: Ensure docker-compose command is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v docker-compose >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            printf '%s\n' '#!/usr/bin/env bash' 'exec docker compose "$@"' > "$HOME/.local/bin/docker-compose"
            chmod +x "$HOME/.local/bin/docker-compose"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          docker-compose version || docker compose version

      - name: Run sandbox lifecycle acceptance
        env:
          ORKET_RUN_SANDBOX_ACCEPTANCE: "1"
        run: |
          python -m pytest -q tests/acceptance/test_sandbox_orchestrator_live_docker.py tests/acceptance/test_sandbox_runtime_recovery_live_docker.py tests/acceptance/test_sandbox_orphan_reconciliation_live_docker.py tests/acceptance/test_sandbox_restart_reclaim_live_docker.py tests/acceptance/test_sandbox_terminal_evidence_cleanup_live_docker.py tests/acceptance/test_sandbox_cleanup_leak_gate.py tests/acceptance/test_sandbox_cleanup_claim_race.py tests/acceptance/test_sandbox_store_outage_fail_closed.py

      - name: Enforce sandbox leak gates
        shell: bash
        env:
          ORKET_SANDBOX_LEAK_ALLOWLIST: ""
        run: |
          python scripts/ci/sandbox_leak_gate.py

  docker_smoke:
    runs-on: ubuntu-latest
    needs: [quality, product_quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t orket:${{ github.sha }} .

      - name: Start container
        run: |
          docker run -d --name orket-smoke -p 8082:8082 orket:${{ github.sha }}

      - name: Probe health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8082/health >/dev/null; then
              echo "Health probe succeeded"
              exit 0
            fi
            sleep 2
          done
          echo "Health probe failed"
          docker logs orket-smoke || true
          exit 1

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f orket-smoke || true

  migration_smoke:
    runs-on: ubuntu-latest
    needs: [quality, product_quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./orket_extension_sdk[testing]" -e ".[dev]"

      - name: Bootstrap runtime/webhook schemas
        run: |
          python scripts/ci/migration_smoke_validator.py --runtime-db .ci/runtime.db --webhook-db .ci/webhook.db --bootstrap

      - name: Run migration smoke
        run: |
          python scripts/governance/run_migrations.py --runtime-db .ci/runtime.db --webhook-db .ci/webhook.db

      - name: Validate migration tables
        run: |
          python scripts/ci/migration_smoke_validator.py --runtime-db .ci/runtime.db --webhook-db .ci/webhook.db --validate
