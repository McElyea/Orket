name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rulesim_determinism_matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./orket_extension_sdk[testing]" -e ".[dev]"

      - name: Enforce rulesim golden determinism
        run: |
          python -m pytest -q tests/rulesim/test_toy4_golden.py

  docs_hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./orket_extension_sdk[testing]" -e ".[dev]"

      - name: Enforce install surface convergence
        run: |
          python scripts/governance/check_install_surface_convergence.py

      - name: Enforce docs project hygiene
        run: |
          python scripts/governance/check_docs_project_hygiene.py

      - name: Enforce workload contract path/schema checks
        run: |
          python -m pytest tests/contracts/test_workload_contract_schema.py -q

  architecture_gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./orket_extension_sdk[testing]" -e ".[dev]"

      - name: Enforce core value and effect boundaries
        env:
          ORKET_DISABLE_SANDBOX: "1"
        run: |
          python -m pytest -q tests/contracts/test_core_effect_values.py tests/integration/test_core_effect_boundaries.py tests/contracts/test_execution_turn_time.py tests/integration/test_turn_time_inputs.py tests/contracts/test_bundle_manifest_inputs.py tests/integration/test_bundle_operation_ownership.py tests/integration/test_issue_dispatch_clock_inputs.py tests/integration/test_issue_dispatch_terminal_transaction.py tests/contracts/test_bug_fix_phase_values.py tests/integration/test_bug_fix_phase_effects.py tests/integration/test_bug_fix_phase_pipeline.py tests/core/test_domain_deprecation_shim.py tests/application/test_governed_agent_ports.py tests/e2e/test_governed_agent_wake_commands.py tests/integration/test_governed_agent_wake_command_clock.py tests/e2e/test_governed_agent_run_commands.py tests/integration/test_governed_agent_submission_ownership.py tests/integration/test_governed_agent_submission_inputs.py tests/integration/test_governed_agent_provider_inputs.py tests/application/test_governed_agent_submission_options.py tests/integration/test_protocol_ledger_worker_ownership.py tests/integration/test_protocol_operation_commit_authority.py tests/integration/test_protocol_operation_commit_process.py tests/application/test_async_protocol_run_ledger.py tests/runtime/test_operation_commit_registry.py tests/integration/test_dual_ledger_recovery_authority.py tests/integration/test_dual_ledger_durable_failures.py tests/integration/test_dual_ledger_clock_refusal.py tests/integration/test_dual_ledger_native_ownership.py tests/application/test_async_dual_write_run_ledger.py tests/integration/test_agent_child_stdio_teardown.py tests/integration/test_agent_invocation_lifetime.py tests/contracts/test_run_graph_values.py tests/integration/test_protocol_graph_publication.py tests/contracts/test_provider_target_values.py tests/integration/test_provider_inventory_inputs.py tests/integration/test_provider_inventory_load_observation.py tests/contracts/test_sandbox_verification_values.py tests/integration/test_sandbox_verification_authority.py tests/integration/test_sandbox_verification_lifetime.py tests/integration/test_sandbox_verification_persistence.py tests/integration/test_sandbox_verification_json_admission.py tests/integration/test_provider_preparation_authority.py tests/adapters/test_local_model_provider_runtime_target.py tests/contracts/test_eos_calendar_values.py tests/integration/test_api_authority_inputs.py tests/contracts/test_flow_run_admission.py tests/integration/test_flow_authoring_authority.py tests/integration/test_flow_storage_lifetime.py tests/contract/test_application_background_lifetime.py tests/contract/test_webhook_ingress_clock.py tests/interfaces/test_webhook_factory.py tests/interfaces/test_webhook_rate_limit.py tests/integration/test_webhook_ingress_ownership.py tests/integration/test_webhook_review_lifetime.py tests/integration/test_webhook_startup_lifetime.py tests/adapters/test_gitea_webhook.py tests/adapters/test_webhook_db.py tests/integration/test_api_construction_ownership.py tests/integration/test_api_construction_inputs.py tests/integration/test_api_preparation_interruption.py tests/integration/test_api_server_bootstrap.py tests/integration/test_api_server_reload.py tests/integration/test_extension_capability_api_lifetime.py tests/integration/test_extension_generation_options_api.py tests/integration/test_piper_process_lifetime.py tests/integration/test_interaction_cancel_ownership.py tests/integration/test_operator_completion_views.py tests/integration/test_api_startup_ownership.py tests/integration/test_api_observation_ownership.py tests/integration/test_api_interaction_cancellation.py tests/integration/test_direct_interaction_scenario.py tests/scripts/test_stream_provider_identity.py tests/contracts/test_interaction_values.py tests/integration/test_interaction_transition_lifetime.py tests/integration/test_interaction_inputs.py tests/integration/test_interaction_artifact_ownership.py tests/integration/test_api_interaction_lifetime.py tests/integration/test_interaction_subscription_lifetime.py tests/streaming tests/interfaces/test_api_interactions.py tests/interfaces/test_sessions_router_protocol_replay.py tests/contracts/test_crash_report_inputs.py tests/integration/test_crash_report_service.py tests/integration/test_cli_crash_publication.py tests/application/test_main_crash_handler.py tests/runtime/test_logging_isolation.py tests/core/test_runtime_event_logging.py tests/contracts/test_project_vendor_selection.py tests/integration/test_project_vendor_service.py tests/integration/test_project_vendor_http.py tests/adapters/test_gitea_vendor.py tests/platform/test_config_loader.py tests/integration/test_driver_command_ownership.py tests/integration/test_reforger_command_ownership.py tests/integration/test_reforger_tools_family.py tests/application/test_driver_cli.py tests/integration/test_extension_catalog_inputs.py tests/integration/test_protocol_query_ownership.py tests/e2e/test_protocol_query_commands.py tests/interfaces/test_api_host_dispatch.py tests/integration/test_settings_input_ownership.py tests/integration/test_settings_persistence_lifetime.py tests/integration/test_settings_api_persistence.py tests/application/test_settings_async_api.py tests/application/test_settings_bridge.py tests/application/test_settings_preferences_migration.py tests/application/test_settings_load_env.py tests/integration/test_runtime_entrypoints.py tests/runtime/test_module_registry.py tests/integration/test_coordinator_authority.py tests/integration/test_coordinator_lifetime.py tests/interfaces/test_coordinator_api.py tests/interfaces/test_coordinator_api_control_plane.py tests/application/test_coordinator_store.py tests/application/test_coordinator_control_plane_reservation_service.py tests/platform/test_leases.py tests/platform/test_hedged.py tests/integration/test_api_captured_websocket_inputs.py tests/integration/test_api_workspace_lifetime.py tests/integration/test_extension_scaffold_ownership.py tests/e2e/test_packaged_extension_scaffold.py tests/integration/test_decision_input_boundaries.py tests/integration/test_model_selection_inputs.py tests/integration/test_model_selection_consumers.py tests/integration/test_prompt_policy_inputs.py tests/integration/test_scheduler_clock_inputs.py tests/integration/test_tool_result_persistence.py tests/integration/test_turn_result_worker_ownership.py tests/integration/test_sdk_memory_inputs.py tests/integration/test_sqlite_wal_admission.py tests/platform/test_root_database_guard.py tests/contracts/test_prompt_metadata_values.py tests/integration/test_prompt_command_ownership.py tests/integration/test_setup_command_ownership.py tests/integration/test_vision_command_ownership.py tests/application/test_prompts_cli.py tests/application/test_prompt_cli_canonical.py tests/integration/test_toolbox_refactor.py tests/interfaces/test_operator_view_models.py tests/interfaces/test_api_operator_views.py tests/integration/test_extension_module_origin.py tests/integration/test_extension_load_ownership.py tests/integration/test_run_start_publication.py tests/integration/test_run_start_ownership.py tests/runtime/test_extension_manager.py tests/runtime/test_extension_components.py tests/runtime/test_extension_import_guard.py tests/runtime/test_governed_agent_subprocess.py tests/integration/test_sdk_process_lifetime.py tests/integration/test_sdk_process_control_plane.py tests/integration/test_sdk_exchange_ownership.py tests/contracts/test_sdk_process_observations.py tests/runtime/test_controller_dispatcher.py tests/runtime/test_controller_observability.py tests/integration/test_controller_schema_ownership.py tests/integration/test_extension_construction_inputs.py tests/integration/test_direct_extension_construction.py tests/integration/test_controller_construction_ownership.py tests/integration/test_workload_publication_ownership.py tests/integration/test_workload_publication_inputs.py tests/integration/test_legacy_publication_ownership.py tests/integration/test_workload_policy_inputs.py tests/integration/test_workload_reproducibility_inputs.py tests/runtime/test_workload_policy.py tests/integration/test_extension_installation_ownership.py tests/integration/test_extension_catalog_publication.py tests/integration/test_extension_manager_preflight.py tests/integration/test_extension_git_lifetime.py tests/runtime/test_extension_source_policy.py tests/contracts/test_extension_cli_ownership.py tests/contracts/test_extension_git_cancellation.py tests/integration/test_sandbox_deploy_publication_recovery.py tests/rulesim/test_interruption_reproducibility.py

      - name: Enforce packaged extension template parity
        run: |
          python scripts/governance/sync_extension_templates.py --check

      - name: Enforce dependency direction rules
        run: |
          python -m pytest -q tests/platform/test_dependency_policy_contract.py tests/platform/test_dependency_imports.py
          python scripts/governance/check_dependency_direction.py

      - name: Audit OS registry/spec sync
        run: |
          python scripts/governance/audit_registry.py

      - name: Enforce kernel sovereign gate
        run: |
          python scripts/nervous_system/update_nervous_system_policy_digest_snapshot.py --check
          python -m pytest -q tests/kernel/v1

      - name: Enforce ODR determinism gate (PR tier)
        env:
          ODR_PERMUTATIONS: "10"
          ODR_REPEATS: "5"
        run: |
          python -m pytest -q tests/kernel/v1/test_odr_determinism_gate.py -k gate_pr

      - name: Enforce kernel API interface boundary tests
        run: |
          python -m pytest -q tests/interfaces/test_api_kernel_lifecycle.py

      - name: Enforce launcher safety defaults
        run: |
          python -m pytest -q tests/interfaces/test_server_launcher.py

      - name: Enforce lifecycle subscriber non-duplication
        run: |
          python -m pytest -q tests/interfaces/test_api_lifecycle_subscribers.py

      - name: Enforce provider close contract
        run: |
          python -m pytest -q tests/application/test_orchestrator_epic.py -k closes_provider_per_turn_across_repeated_cycles
          python -m pytest -q tests/adapters/test_local_model_provider_telemetry.py -k close_is_idempotent

      - name: Enforce API composition isolation
        run: |
          python -m pytest -q tests/interfaces/test_api_composition_isolation.py

      - name: Enforce workspace logging isolation
        run: |
          python -m pytest -q tests/runtime/test_logging_isolation.py

      - name: Enforce TD03052026 gate audit readiness
        run: |
          python scripts/governance/check_td03052026_gate_audit.py --require-ready --out benchmarks/results/techdebt/td03052026/readiness_checklist.json

      - name: Enforce kernel fire-drill suite
        run: |
          python scripts/governance/run_kernel_fire_drill.py

      - name: Enforce TS digest parity gate
        run: |
          npm test --prefix conformance/ts

      - name: Enforce digest vectors are committed truth (no CI overwrite)
        run: |
          python scripts/governance/gen_digest_vectors.py --out /tmp/digest-v1.json
          diff -u tests/kernel/v1/vectors/digest-v1.json /tmp/digest-v1.json

      - name: Enforce volatility boundary script
        run: |
          python scripts/benchmarks/check_volatility_boundaries.py

      - name: Enforce volatility boundary tests
        run: |
          python -m pytest -q tests/platform/test_architecture_volatility_boundaries.py

      - name: Build retention dry-run plan
        run: |
          python scripts/governance/retention_plan.py --out benchmarks/results/governance/retention_plan.json

      - name: Enforce retention policy safety
        run: |
          python scripts/governance/check_retention_policy.py --plan benchmarks/results/governance/retention_plan.json --out benchmarks/results/governance/retention_policy_check.json --require-safety

      - name: Enforce offline capability matrix contract
        run: |
          python scripts/benchmarks/check_offline_matrix.py --require-default-offline --out benchmarks/results/benchmarks/offline_matrix_check.json

      - name: Enforce docs gate fixture contract
        run: |
          bash tests/acceptance/docs_gate/run.sh
          python -m pytest -q tests/application/test_docs_lint_script.py

      - name: Enforce protocol-governed parity campaign smoke
        run: |
          mkdir -p .ci/protocol_quality_workspace/.orket/durable/db
          mkdir -p benchmarks/results/benchmarks/protocol_governed
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from orket.adapters.storage.async_protocol_run_ledger import AsyncProtocolRunLedgerRepository
          from orket.adapters.storage.async_repositories import AsyncRunLedgerRepository

          async def seed() -> None:
              workspace = Path(".ci/protocol_quality_workspace").resolve()
              sqlite_db = workspace / ".orket" / "durable" / "db" / "orket_persistence.db"
              sqlite = AsyncRunLedgerRepository(sqlite_db)
              protocol = AsyncProtocolRunLedgerRepository(workspace)
              for run_id in ("run-a", "run-b"):
                  await sqlite.start_run(
                      session_id=run_id,
                      run_type="epic",
                      run_name="CI Protocol",
                      department="core",
                      build_id="build-1",
                      summary={"session_status": "running"},
                      artifacts={"workspace": "workspace/default"},
                  )
                  await sqlite.finalize_run(
                      session_id=run_id,
                      status="incomplete",
                      summary={"session_status": "incomplete"},
                      artifacts={"gitea_export": {"provider": "gitea"}},
                  )
                  await protocol.start_run(
                      session_id=run_id,
                      run_type="epic",
                      run_name="CI Protocol",
                      department="core",
                      build_id="build-1",
                      summary={"session_status": "running"},
                      artifacts={"workspace": "workspace/default"},
                  )
                  await protocol.append_event(
                      session_id=run_id,
                      kind="operation_result",
                      payload={"operation_id": "op-1", "tool": "write_file", "result": {"ok": True}},
                  )
                  await protocol.finalize_run(
                      session_id=run_id,
                      status="incomplete",
                      summary={"session_status": "incomplete"},
                      artifacts={"gitea_export": {"provider": "gitea"}},
                  )

          asyncio.run(seed())
          PY
          python scripts/protocol/run_protocol_ledger_parity_campaign.py --sqlite-db .ci/protocol_quality_workspace/.orket/durable/db/orket_persistence.db --protocol-root .ci/protocol_quality_workspace --strict --out benchmarks/results/protocol/protocol_governed/protocol_ledger_parity_campaign.json
          python scripts/protocol/run_protocol_determinism_campaign.py --runs-root .ci/protocol_quality_workspace/runs --run-id run-a --baseline-run-id run-a --strict --out benchmarks/results/protocol/protocol_governed/protocol_replay_campaign.json
          python scripts/protocol/publish_protocol_rollout_artifacts.py --workspace-root .ci/protocol_quality_workspace --out-dir benchmarks/results/protocol/protocol_governed/rollout_artifacts --run-id run-a --session-id run-a --baseline-run-id run-a --strict
          python scripts/protocol/summarize_protocol_error_codes.py --input benchmarks/results/protocol/protocol_governed/protocol_ledger_parity_campaign.json --out benchmarks/results/protocol/protocol_governed/protocol_error_code_summary.json

      - name: Enforce controller workload parity gate
        run: |
          python -m pytest -q tests/sdk/test_controller.py
          python -m pytest -q tests/runtime/test_controller_observability.py tests/runtime/test_controller_replay_parity.py
          python -m pytest -q tests/scripts/test_compare_controller_replay_parity.py

      - name: Enforce roadmap metrics (quick gate)
        run: |
          python scripts/governance/check_roadmap_metrics.py --quick

      - name: Enforce model-streaming scenario gate
        run: |
          python scripts/streaming/run_model_streaming_gate.py --provider-mode stub --timeout 20

      - name: Validate prompt assets
        run: |
          python -m orket.interfaces.prompts_cli --root . validate --json

      - name: Smoke resolve canonical prompt
        run: |
          python -m orket.interfaces.prompts_cli --root . resolve --role architect --dialect generic --selection-policy stable

      - name: Smoke diff prompt policies
        run: |
          python -m orket.interfaces.prompts_cli --root . diff --role architect --dialect generic --left-policy stable --right-policy canary

      - name: Enforce line-ending normalization
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "Line ending normalization drift detected:"
            git diff --cached --name-only
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    needs: [architecture_gates, docs_hygiene]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./orket_extension_sdk[testing]" -e ".[dev]"

      - name: Run tests with coverage
        # Floor is set 5pts above the observed 83.94% baseline. See docs/internal/COVERAGE_DEBT.md.
        run: pytest tests/ --cov=orket --cov-fail-under=89

      - name: Ruff lint
        run: ruff check orket tests

      - name: Mypy type check
        run: mypy orket/ --ignore-missing-imports

      - name: Enforce datetime.now UTC usage
        run: |
          if grep -R --line-number "datetime.now()" orket --include="*.py" | grep -v "now(UTC)"; then
            echo "Found disallowed datetime.now() usage"
            exit 1
          fi

      - name: Enforce core value and effect boundaries
        env:
          ORKET_DISABLE_SANDBOX: "1"
        run: |
          python -m pytest -q tests/contracts/test_core_effect_values.py tests/integration/test_core_effect_boundaries.py tests/contracts/test_execution_turn_time.py tests/integration/test_turn_time_inputs.py tests/contracts/test_bundle_manifest_inputs.py tests/integration/test_bundle_operation_ownership.py tests/integration/test_issue_dispatch_clock_inputs.py tests/integration/test_issue_dispatch_terminal_transaction.py tests/contracts/test_bug_fix_phase_values.py tests/integration/test_bug_fix_phase_effects.py tests/integration/test_bug_fix_phase_pipeline.py tests/core/test_domain_deprecation_shim.py tests/application/test_governed_agent_ports.py tests/e2e/test_governed_agent_wake_commands.py tests/integration/test_governed_agent_wake_command_clock.py tests/e2e/test_governed_agent_run_commands.py tests/integration/test_governed_agent_submission_ownership.py tests/integration/test_governed_agent_submission_inputs.py tests/integration/test_governed_agent_provider_inputs.py tests/application/test_governed_agent_submission_options.py tests/integration/test_protocol_ledger_worker_ownership.py tests/integration/test_protocol_operation_commit_authority.py tests/integration/test_protocol_operation_commit_process.py tests/application/test_async_protocol_run_ledger.py tests/runtime/test_operation_commit_registry.py tests/integration/test_dual_ledger_recovery_authority.py tests/integration/test_dual_ledger_durable_failures.py tests/integration/test_dual_ledger_clock_refusal.py tests/integration/test_dual_ledger_native_ownership.py tests/application/test_async_dual_write_run_ledger.py tests/integration/test_agent_child_stdio_teardown.py tests/integration/test_agent_invocation_lifetime.py tests/contracts/test_run_graph_values.py tests/integration/test_protocol_graph_publication.py tests/contracts/test_provider_target_values.py tests/integration/test_provider_inventory_inputs.py tests/integration/test_provider_inventory_load_observation.py tests/contracts/test_sandbox_verificat