[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "orket-governed-agent-starter"
version = "0.8.0"
description = "Bounded external governed-agent starter for Orket"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["orket-extension-sdk==0.8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.setuptools]
py-modules = ["governed_agent"]
