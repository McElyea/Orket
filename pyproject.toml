[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orket"
version = "0.6.83"
description = "Local-first workflow runtime for card-based execution"
authors = [
    { name = "Jonathan McElyea" }
]
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # Core
    "orket-extension-sdk==0.7.0a1",
    "jsonschema>=4.20.0,<5.0.0",
    "ollama>=0.4.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "packaging>=23.0,<27.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "rfc8785>=0.1.4,<1.0.0",
    "google-crc32c>=1.5.0,<2.0.0",
    # Scheduled wakes require IANA zones even on hosts without a system database.
    "tzdata>=2024.1",

    # Web framework
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "python-multipart>=0.0.6,<1.0.0",

    # Async I/O (replacing sync libraries)
    "httpx>=0.26.0,<1.0.0",
    "aiosqlite>=0.19.0,<1.0.0",
    "aiofiles>=23.2.0,<26.0.0",

    # Security
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.0,<2.0.0",

    # System monitoring
    "psutil>=5.9.0,<7.0.0",

]

[project.scripts]
orket = "orket.cli:main"
orket-prompts = "orket.interfaces.prompts_cli:main"
orket-quickstart = "orket.quickstart.governed_action_demo:main"

[project.optional-dependencies]
dev = [
    "setuptools>=77.0.0",
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "respx>=0.20.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-aiofiles",
    "types-PyYAML",
    "types-psutil",
    "types-jsonschema",
    "types-python-jose",
    "types-passlib",
]
vision = [
    # Heavy ML dependencies - only install if needed
    "Pillow>=10.0.0,<13.0.0",
    "diffusers>=0.25.0",
    "transformers>=4.37.0",
    "accelerate>=0.25.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
]
docs = [
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
]
audio = [
    "piper-tts>=1.3.0,<2.0.0",
    "sounddevice>=0.4.6,<1.0.0",
    "numpy>=1.26.0,<3.0.0",
]
profile_engine_only = []
profile_developer_local = []
profile_api_runtime = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
]
profile_api_webhook_runtime = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "httpx>=0.26.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orket", "orket.*"]

[tool.setuptools.package-data]
"orket" = ["permissions.json", "permissions.schema.json"]
"orket.kernel.v1.odr" = ["artifact.schema.json"]
"orket.quickstart" = ["*.yaml"]
"orket.runtime.config" = ["local_prompt_profiles.json", "*.jinja", "assets/artifacts/*", "assets/policies/*", "assets/tools/*", "assets/contracts/*", "assets/extension_templates/*.zip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated proof of a single behavior",
    "contract: schema or interface conformance proof",
    "integration: real-path proof across component boundaries",
    "end_to_end: user-visible or system-level proof across the full path",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "B",      # bugbear bug patterns
    "I",      # import sorting
    "UP",     # pyupgrade
    "SIM",    # simplify
    "ASYNC",  # async anti-patterns
    "PTH",    # pathlib preference
    "E722",   # bare except (CRITICAL - never allow)
]
ignore = [
    "E501",   # pre-existing repo-wide line-length backlog remains out of scope for this fix cycle
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
mypy_path = "stubs"
exclude = "(^tests/|^scripts/|^benchmarks/)"

[tool.coverage.run]
source = ["orket"]
branch = true
omit = ["tests/*", "scripts/*", "benchmarks/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
