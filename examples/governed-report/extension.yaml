manifest_version: v0
extension_id: example.structured-report
extension_version: 0.8.0
allowed_stdlib_modules: []
workloads:
  - workload_id: governed-agent-loop
    entrypoint: report_agent:ReportAgent
    required_capabilities: [agent.iteration.v1]
    workload_kind: agent
    input_contract: agent_iteration_request.v1
    output_contract: agent_iteration_result.v1
    agent:
      contract_version: governed_agent_loop.v1
      required_host_features: [agent_stdio_ipc.v1, governed_agent_loop.v1, agent_model_use_receipt.v2]
      model_profiles:
        - role: reporter
          profile_ref: local.reporter
      recovery_posture: fail_closed
      resource_requirements:
        max_model_calls_per_iteration: 1
        max_progress_events_per_iteration: 1
        max_result_bytes: 262144
        max_inference_concurrency: 1
