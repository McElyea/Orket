manifest_version: v0
extension_id: gardener.repository.audit
extension_version: 0.8.0
allowed_stdlib_modules: []
workloads:
  - workload_id: repository-audit
    entrypoint: repository_audit_agent:RepositoryAuditAgent
    required_capabilities:
      - agent.iteration.v1
    workload_kind: agent
    input_contract: agent_iteration_request.v1
    output_contract: agent_iteration_result.v1
    agent:
      contract_version: governed_agent_loop.v1
      required_host_features:
        - agent_stdio_ipc.v1
        - governed_agent_loop.v1
        - agent_model_use_receipt.v2
        - agent_advisory_report_verification.v1
      model_profiles:
        - role: auditor
          profile_ref: local.auditor
      recovery_posture: fail_closed
      resource_requirements:
        max_model_calls_per_iteration: 2
        max_progress_events_per_iteration: 2
        max_result_bytes: 262144
        max_inference_concurrency: 1
